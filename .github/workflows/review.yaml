name: review
run-name: Review snap

on:
  schedule:
    - cron: "0 0 * * *"
  pull_request:
    paths:
    - '!**.md'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag
        required: false
        type: string

jobs:

  download:
    runs-on: ${{ matrix.builder }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - builder: ubuntu-24.04
            arch: amd64
          - builder: ubuntu-24.04-arm
            arch: arm64
    steps:
    - name: download snap
      uses: robinraju/release-downloader@v1.13
      with:
        latest: true
        tag: ${{ inputs.ref }}
        fileName: "mastodon-server_*_amd64.snap"
      id: download
    - name: set snap name
      run: echo "${{ matrix.arch }}=$(basename "${{ fromJson(steps.download.outputs.downloaded_files)[0] }}")" >> "$GITHUB_OUTPUT"
      id: snap_file
    - uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.snap_file.outputs[matrix.arch] }}
        path: ${{ steps.snap_file.outputs[matrix.arch] }}
        retention-days: 1
        overwrite: true
    outputs:
      amd64: ${{ steps.snap_file.outputs[matrix.arch] }}

  scan:
    needs: download
    runs-on: ${{ matrix.builder }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - builder: ubuntu-24.04
            arch: amd64
          - builder: ubuntu-24.04-arm
            arch: arm64
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/scan
      with:
        snap: ${{ needs.download.outputs[matrix.arch] }}

  review:
    needs:
    - download
    - scan
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
    - uses: actions/checkout@v7

    - name: install review-tools
      shell: bash
      run: sudo snap install review-tools --classic

    - name: define color commands
      shell: bash
      run: |
        RED="\033[31m"
        GREEN="\033[32m"
        YELLOW="\033[33m"
        RESET="\033[0m"
        SHEBANG="#!/bin/bash"
        colorize() { echo "while IFS= read -r line; do echo -e \"$1\$line$RESET\"; done"; }
        mkdir -p ~/bin
        echo -e "$SHEBANG\n$(colorize $RED)" > ~/bin/red
        echo -e "$SHEBANG\n$(colorize $GREEN)" > ~/bin/green
        echo -e "$SHEBANG\n$(colorize $YELLOW)" > ~/bin/yellow
        sudo chmod +x ~/bin/*
        echo "$HOME/bin" >> $GITHUB_PATH

    - uses: actions/download-artifact@v8
      with:
        name: ${{ needs.download.outputs['amd64'] }}
    - uses: actions/download-artifact@v8
      with:
        name: ${{ needs.download.outputs['arm64'] }}

    - name: review snap
      id: review
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: ${{ github.repository }}
      run: |
        echo "Get version" | yellow
        version=$(echo "${{ needs.download.outputs['amd64'] }}" | sed -nE "s/^mastodon-server_([^_]+)_amd64\.snap$/\1/p")
        if [ -n "$version" ]; then
          echo "Version found: $version" | green
          title="Review for release $version"
        else
          echo Version not found | red
          exit 1
        fi

        echo "Get new versions" | yellow
        versions="$(python3 tools/versions.py -ms)"
        if [ -z "$versions" ]; then
          echo "Everything up to date" | green
        else
          echo "New versions found" | yellow
          body="$body## New versions\n$versions"
        fi

        echo "Get vulnerabilities" | yellow
        vulnerabilities="$(python3 tools/vulnerabilities.py -ms)"
        if [ -z "$vulnerabilities" ]; then
          echo "No known vulnerabilities" | green
        else
          echo "Vulnerabilities found" | yellow
          if ! [ -z "$body" ]; then body="$body\n"; fi
          body="$body## Vulnerabilities\n$vulnerabilities"
        fi

        notices_json="{}"

        for arch in amd64 arm64; do
          case "$arch" in
            amd64) snap_file="${{ needs.download.outputs.amd64 }}" ;;
            arm64) snap_file="${{ needs.download.outputs.arm64 }}" ;;
          esac

          echo "Run review-tools" | yellow
          if review_results=$(review-tools.check-notices $snap_file); then
            echo "Get security notices" | yellow
            notices_json_arch=$(echo "$review_results" | jq -r ".\"mastodon-server\".\"$version\"")
            notices_json=$(jq -n \
              --argjson notices "$notices_json" \
              --argjson add "$notices_json_arch" \
              'reduce (($notices, $add) | to_entries[]) as $entry
                ({}; .[$entry.key] = ((.[$entry.key] // []) + $entry.value))
                | with_entries(.value |= unique)')
          else
            echo Running review-tools for $arch failed | red
            echo "$review_results"
            exit 1
          fi
        done

        if [ "$notices_json" == "{}" ]; then
          echo "No new security notice" | green
        else
          echo "Security notices found" | yellow
          notices=$(echo "$notices_json" | jq -r 'to_entries | ["| Name | Security notices |", "| --- | --- |"] + map("| " + .key + " | " + ( .value | map("[\(. )](http://ubuntu.com/security/notices/\(.))") | join("<br>") ) + " |") | .[]')
          if ! [ -z "$body" ]; then body="$body\n"; fi
          body="$body## Security notices\n$notices"
        fi

        if ! [ -z "$body" ]; then
          existing_issue=$(gh search issues --match title "$title" --json number,title --jq ".[] | select(.title == \"$title\")")
          if [ -z "$existing_issue" ]; then
            echo "Creating new GitHub issue" | yellow
            gh issue create --title "$title" --body "$(echo -e "$body")" --label security
          else
            issue_number=$(echo "$existing_issue" | jq -r ".number")
            date=$(date +"%Y-%m-%d")
            echo "Updating existing GitHub issue $issue_number" | yellow
            gh issue edit "$issue_number" --body "$(echo -e "*Updated: $date*\n$body")"
            gh issue reopen "$issue_number"
          fi
        fi
