name: build
run-name: Build snap

inputs:
  ref:
    required: false
    type: string

outputs:
  snap:
    value: ${{ steps.build.outputs.snap }}

runs:
  using: composite
  steps:

  - uses: actions/checkout@v4
    with:
      ref: ${{ inputs.ref }}

  - name: make scripts executable
    shell: bash
    run: find src -type f -path "*/bin/*" -exec chmod +x {} \;

  - uses: canonical/action-build@v1
    id: build

  - uses: actions/upload-artifact@v4
    with:
      name: ${{ steps.build.outputs.snap }}
      path: ${{ steps.build.outputs.snap }}
      retention-days: 1
      overwrite: true

  - name: show snapcraft logs
    if: ${{ success() || failure() }}
    shell: bash
    run: |
      for file in /home/runner/.local/state/snapcraft/log/*.log; do
        echo "::group::$file"
        sudo cat $file
        echo "::endgroup::"
      done
